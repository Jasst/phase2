<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e11">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AI">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <title>AI-ассистент</title>

  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/ai.css">
  <link rel="stylesheet" href="/static/ui.css">
  <link rel="stylesheet" href="/static/ui-polish.css">
  <link rel="stylesheet" href="/static/ui-refined.css">
  <link rel="stylesheet" href="/static/vendor/github-dark.min.css">
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/highlight.min.js"></script>
</head>
<body class="ai-body">
<div class="app" id="app">

  <aside class="sidebar" id="sidebar">
    <div class="sb-top">
      <div class="brand">
        <span class="brand-mark">✦</span>
        <span class="brand-name">Ассистент</span>
        <span class="status" id="status" title="Проверка связи"></span>
      </div>
      <button class="btn-new" id="newChatBtn" type="button">
        <span class="plus">＋</span> Новый чат <kbd>Ctrl K</kbd>
      </button>
      <div class="search">
        <input id="searchInput" type="search" placeholder="Поиск по чатам (/)" autocomplete="off">
      </div>
    </div>

    <div class="sb-pull-anchor">
      <div class="pull-indicator" id="sbPullIndicator" aria-hidden="true"><span class="pi-spin">↻</span> <span class="pi-text">Потяните вниз, чтобы обновить список</span></div>
    </div>
    <nav class="sb-list" id="sessionList" aria-label="Чаты"></nav>

    <div class="sb-bottom">
      <a class="sb-link" id="networkLink" href="/network" title="Как сеть учится и развивается">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M7 6h10M6.5 7.5l4 9M17.5 7.5l-4 9"/></svg>
        Сеть импульсов
      </a>
                      </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" type="button" aria-label="Список чатов">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="title-wrap">
        <h1 class="chat-title" id="chatTitle">Новый чат</h1>
        <span class="chat-sub" id="chatSub"></span>
      </div>
      <div class="top-actions">
        <!-- Кнопка-триггер вместо нативного <select>: системный dropdown не
             стилизуется и выглядит чужеродно. Список рисует ai-app.js в стиле
             приложения (.model-dd); скрытый select ниже — только для значения. -->
        <button class="model-select" id="modelSelectBtn" type="button"
                aria-haspopup="listbox" aria-expanded="false" title="Выбрать модель" hidden>
          <span class="model-name" id="modelName"></span>
          <!-- подпись «в памяти: …»: показывается, когда выбрана одна модель,
               а в VRAM сейчас держится другая (грузится в фоне / переключили
               вручную). Управляется JS (updateModelLabel), по умолчанию скрыта -->
          <span class="model-status" id="modelStatus" hidden></span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <select id="modelSelect" aria-hidden="true" style="display:none"></select>
        <button class="icon-btn" id="modelSettingsBtn" type="button" title="Настройки модели" aria-label="Настройки модели">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <button class="icon-btn" id="renameBtn" type="button" title="Переименовать" disabled>
          <img class="ico" src="/static/icons/Edit.png" alt="">
        </button>
        <button class="icon-btn" id="exportBtn" type="button" title="Скачать чат (Markdown)" disabled>
          <img class="ico" src="/static/icons/Download.png" alt="">
        </button>
        <button class="icon-btn" id="clearBtn" type="button" title="Очистить историю" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21h10"/><path d="M5.5 14.5 12 8l6 6-5.5 5.5H9.5L5.5 14.5Z"/><path d="M12 8l-3-3 5-2 4 4-2 3"/></svg>
        </button>
        <button class="icon-btn danger" id="deleteBtn" type="button" title="Удалить чат" disabled>
          <img class="ico" src="/static/icons/Remove.png" alt="">
        </button>
      </div>
    </header>

    <div class="msgs-wrap">
    <section class="messages" id="messages" role="log" aria-live="polite">
      <div class="pull-indicator" id="pullIndicator" aria-hidden="true"><span class="pi-spin">↻</span> <span class="pi-text">Потяните вниз, чтобы обновить чаты</span></div>
      <div class="msgs-inner" id="inner"></div>
    </section>
      <button class="scroll-bottom" id="scrollBottomBtn" type="button" hidden aria-label="К концу переписки">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>
      </button>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <div class="attach-chip" id="attachChip" hidden>
          <img id="attachThumb" alt="">
          <span id="attachName"></span>
          <button type="button" id="attachRemove" aria-label="Убрать изображение">×</button>
        </div>
        <textarea id="input" rows="1" placeholder="Напишите сообщение…"></textarea>
        <div class="composer-bar">
          <div class="tools">
            <button class="tool" id="attachBtn" type="button" title="Прикрепить изображение">
              <img class="ico" src="/static/icons/Attach.png" alt="" style="width:15px;height:15px"><svg class="ti" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg><span class="tl">Фото</span>
            </button>
            <button class="tool" id="toggleWeb" type="button" aria-pressed="false" title="Искать в интернете"><span class="ti-emoji">🌐</span><svg class="ti" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span class="tl">Поиск</span></button>
            <button class="tool" id="toggleReason" type="button" aria-pressed="false" title="Показывать ход рассуждений"><span class="ti-emoji">🧠</span><svg class="ti" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="9" y1="18" x2="15" y2="18"/><line x1="10" y1="22" x2="14" y2="22"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg><span class="tl">Рассуждения</span></button>
          </div>
          <span class="counter" id="counter"></span>
          <button class="mic" id="micBtn" type="button" title="Голосовой ввод: нажмите и говорите" aria-label="Голосовой ввод" aria-pressed="false" hidden><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg></button>
          <button class="send" id="sendBtn" type="button" title="Отправить" aria-label="Отправить">➤</button>
        </div>
      </div>
      <p class="hint" id="hint"><span id="hintText">Enter — отправить · Shift+Enter — новая строка · / — поиск по чатам</span> <button type="button" class="link-btn" id="hintBtn" hidden>Открыть</button></p>
    </div>
    <input type="file" id="fileInput" hidden accept="image/*,.json,.txt,.md,.csv,.tsv,.log,.py,.js,.ts,.jsx,.tsx,.css,.html,.htm,.xml,.yaml,.yml,.toml,.ini,.cfg,.sql,.sh,.java,.kt,.go,.rs,.c,.h,.cpp,.hpp,.cs,.rb,.php,.swift,.srt,.vtt">
  </main>
</div>


<!-- Подтверждение выхода: случайное нажатие не выкидывает из аккаунта -->

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
  // Регистрация service worker: нужна, чтобы браузер разрешил установку
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch((e) => console.warn('SW:', e));
  }


</script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/ai-store.js" defer></script>
<script src="/static/js/ai-app.js" defer></script>
<script src="/static/js/model-settings.js" defer></script>
<script src="/static/js/topbar-menu.js" defer></script>
</body>
</html>
